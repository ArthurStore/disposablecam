<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base id="app-base" href="">
  <script>
    (function () {
      var b = document.getElementById('app-base');
      var p = window.location.pathname.replace(/\/recap(\/[^/]*)?\/?$/, '/');
      b.href = p.endsWith('/') ? p : p + '/';
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Recap Album</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/recap.css">
  <link rel="stylesheet" href="css/dynamic-aspect.css">
</head>
<body class="recap-page">
  <div class="recap-ambient" id="recap-ambient" aria-hidden="true"></div>
  <div class="recap-shell">
  <header class="recap-hero" id="recap-hero">
    <button type="button" class="hero-banner hidden" id="hero-banner" aria-label="Event cover">
      <div class="hero-banner-media">
        <div class="hero-banner-bg" id="hero-banner-bg"></div>
        <div class="hero-banner-blur" aria-hidden="true"></div>
        <div class="hero-banner-gradient" aria-hidden="true"></div>
      </div>
    </button>
    <div class="hero-banner-fade" aria-hidden="true"></div>
    <div class="hero-overlay">
      <h1 id="hero-title">The Moments</h1>
      <p id="hero-subtitle">Retreat Event</p>
      <div class="stats-row">
        <div class="stat"><span id="stat-moments" class="stat-num">0</span><span class="stat-label">Moments</span></div>
        <div class="stat"><span id="stat-days" class="stat-num">0</span><span class="stat-label">Days</span></div>
        <div class="stat"><span id="stat-people" class="stat-num">0</span><span class="stat-label">People</span></div>
      </div>
    </div>
  </header>

  <div class="recap-body">
    <div class="recap-body-fixed">
      <div class="pill-toggle">
        <button id="tab-all" class="pill active">All Moments</button>
        <button id="tab-people" class="pill">People Moments</button>
      </div>
      <div id="people-picker" class="people-picker hidden">
        <select id="people-select"><option value="">Select person…</option></select>
      </div>
    </div>

    <div class="recap-scroll-area">
      <p class="grid-hint">Tap any photo to preview and download</p>
      <div id="recap-grids" class="recap-grids"></div>
      <p id="recap-empty" class="recap-empty hidden">No moments captured yet</p>
    </div>
  </div>
  </div>

  <div id="modal-overlay" class="modal-overlay">
    <button id="modal-close" class="modal-close" aria-label="Close">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button id="modal-prev" class="modal-nav modal-prev" aria-label="Previous">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button id="modal-next" class="modal-nav modal-next" aria-label="Next">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div id="modal-content" class="modal-content"></div>
    <p id="modal-counter" class="modal-counter hidden"></p>
    <button id="modal-download" class="modal-download">Download</button>
  </div>

  <script src="js/media-orientation.js"></script>
  <script src="js/recap.js"></script>
</body>
</html>
