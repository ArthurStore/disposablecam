<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DisposableCam">
  <link rel="apple-touch-icon" href="/images/icon.png">
  <link rel="manifest" href="/manifest.json">
  <title>Disposable Camera</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Desktop redirect -->
  <script>
    (function() {
      const isAdmin = window.location.pathname.startsWith('/admin');
      const isLive = window.location.pathname.startsWith('/live');
      const isRecap = window.location.pathname.startsWith('/recap');
      if (!isAdmin && !isLive && !isRecap) {
        const w = window.innerWidth;
        if (w >= 1024) {
          window.location.href = '/live';
        }
      }
    })();
  </script>

  <!-- Flash overlay -->
  <div id="flash-overlay"></div>

  <!-- Shutter overlay -->
  <div id="shutter-overlay">
    <div class="shutter-blade shutter-top"></div>
    <div class="shutter-blade shutter-bottom"></div>
  </div>

  <!-- Registration modal -->
  <div id="registration-modal" class="modal">
    <div class="modal-content">
      <div class="modal-camera-icon">📷</div>
      <h2>Disposable Camera</h2>
      <p class="modal-subtitle">Enter your Participant Number to join</p>
      <input type="text" id="participant-input" placeholder="No. Peserta" autocomplete="off">
      <button id="register-btn" class="btn-primary">Join Event</button>
      <p id="register-error" class="error-text"></p>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" class="hidden">
    <!-- Header / Profile -->
    <header id="profile-header">
      <div class="profile-info">
        <div id="gender-icon" class="gender-icon"></div>
        <div class="profile-text">
          <h1 id="user-name"></h1>
          <span id="user-number"></span>
        </div>
      </div>
      <button id="logout-btn" class="icon-btn" title="Logout">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </header>

    <!-- Camera Section -->
    <section id="camera-section">
      <div id="viewfinder">
        <video id="camera-preview" autoplay playsinline muted></video>
        <canvas id="capture-canvas" class="hidden"></canvas>

        <!-- Caption overlay -->
        <div id="caption-overlay">
          <input type="text" id="caption-input" placeholder="Add caption..." maxlength="100">
        </div>

        <!-- Recording indicator -->
        <div id="recording-indicator" class="hidden">
          <span class="rec-dot"></span> REC
        </div>

        <!-- Mode indicator -->
        <div id="mode-indicator">📸 Photo</div>
      </div>

      <!-- Camera controls -->
      <div id="camera-controls">
        <button id="rotate-btn" class="control-btn" title="Rotate Camera">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
        </button>

        <button id="capture-btn" class="capture-btn">
          <div class="capture-ring">
            <div class="capture-inner"></div>
          </div>
        </button>

        <button id="mode-toggle-btn" class="control-btn" title="Switch Mode">
          <svg id="mode-icon-photo" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        </button>
      </div>

      <!-- Upload progress -->
      <div id="upload-progress" class="hidden">
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <p class="progress-text">Uploading...</p>
      </div>
    </section>

    <!-- Gallery Section -->
    <section id="gallery-section">
      <div class="section-header" id="gallery-toggle">
        <h2>My Gallery</h2>
        <span class="toggle-arrow">▼</span>
      </div>
      <div id="gallery-grid" class="gallery-grid"></div>
      <p id="gallery-empty" class="empty-text hidden">No moments captured yet</p>
    </section>

    <!-- Chat toggle button -->
    <button id="chat-toggle-btn" class="chat-fab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span id="chat-badge" class="chat-badge hidden">0</span>
    </button>

    <!-- Chat panel -->
    <div id="chat-panel" class="chat-panel hidden">
      <div class="chat-header">
        <h3>Live Chat</h3>
        <button id="chat-close-btn" class="icon-btn">✕</button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-bar">
        <input type="text" id="chat-input" placeholder="Type a message..." maxlength="500">
        <button id="chat-send-btn" class="btn-send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Media preview modal -->
  <div id="media-modal" class="modal hidden">
    <div class="media-modal-content">
      <button id="media-modal-close" class="modal-close-btn">✕</button>
      <div id="media-modal-body"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/chat.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/js/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
