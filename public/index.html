<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DisposableCam">
  <link rel="apple-touch-icon" href="images/icon.png">
  <link rel="manifest" href="manifest.json">
  <title>Disposable Camera</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Desktop redirect (relative — works under any base path like /cam/) -->
  <script>
    (function () {
      var p = window.location.pathname;
      var isAdmin = /\/admin(\/|$)/.test(p);
      var isLive  = /\/live(\/|$)/.test(p);
      var isRecap = /\/recap(\/|$)/.test(p);
      if (!isAdmin && !isLive && !isRecap && window.innerWidth >= 1024) {
        window.location.href = 'live';
      }
    })();
  </script>

  <!-- Flash overlay -->
  <div id="flash-overlay"></div>

  <!-- Mechanical shutter overlay -->
  <div id="shutter-overlay">
    <div class="shutter-blade shutter-top"></div>
    <div class="shutter-blade shutter-bottom"></div>
  </div>

  <!-- Registration modal -->
  <div id="registration-modal" class="modal">
    <div class="modal-content">
      <div class="modal-camera-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </div>
      <h2>Disposable Camera</h2>
      <p class="modal-subtitle">Enter your Participant Number to join</p>
      <input type="text" id="participant-input" placeholder="No. Peserta" autocomplete="off">
      <button id="register-btn" class="btn-primary">Join Event</button>
      <p id="register-error" class="error-text"></p>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" class="hidden">
    <!-- Header / Profile -->
    <header id="profile-header">
      <div class="profile-info">
        <div id="gender-icon" class="gender-icon"></div>
        <div class="profile-text">
          <h1 id="user-name"></h1>
          <span id="user-number"></span>
        </div>
      </div>
      <button id="logout-btn" class="icon-btn" title="Logout" aria-label="Logout">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </header>

    <!-- Camera Section -->
    <section id="camera-section">
      <div id="viewfinder">
        <video id="camera-preview" autoplay playsinline muted></video>
        <canvas id="capture-canvas" class="hidden"></canvas>

        <!-- Top bar: REC + mode + ISO/info -->
        <div class="vf-top">
          <div id="recording-indicator" class="hidden">
            <span class="rec-dot"></span> REC <span id="rec-timer">00:00</span>
          </div>
          <div id="mode-indicator">PHOTO</div>
        </div>

        <!-- Camera info HUD -->
        <div class="vf-hud">
          <span id="hud-iso">ISO 400</span>
          <span class="hud-sep">·</span>
          <span id="hud-res">—</span>
          <span class="hud-sep">·</span>
          <span id="hud-time"></span>
        </div>

        <!-- Focus reticle (decorative) -->
        <div class="vf-reticle"><span></span><span></span><span></span><span></span></div>

        <!-- Caption overlay -->
        <div id="caption-overlay">
          <input type="text" id="caption-input" placeholder="Add a caption…" maxlength="100">
        </div>
      </div>

      <!-- Camera controls -->
      <div id="camera-controls">
        <button id="rotate-btn" class="control-btn" title="Flip Camera" aria-label="Flip Camera">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>

        <button id="mirror-btn" class="control-btn" title="Mirror Preview" aria-label="Mirror Preview" aria-pressed="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M8 7l-4 5 4 5"/><path d="M16 7l4 5-4 5"/></svg>
        </button>

        <button id="capture-btn" class="capture-btn" aria-label="Capture">
          <div class="capture-ring">
            <div class="capture-inner"></div>
          </div>
        </button>

        <button id="mode-toggle-btn" class="control-btn" title="Switch Mode" aria-label="Switch Photo/Video Mode">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        </button>

        <button id="grid-btn" class="control-btn" title="Toggle Grid" aria-label="Toggle Grid" aria-pressed="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
        </button>
      </div>

      <!-- Upload progress -->
      <div id="upload-progress" class="hidden">
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <p class="progress-text">Uploading…</p>
      </div>
    </section>

    <!-- Gallery Section -->
    <section id="gallery-section">
      <div class="section-header" id="gallery-toggle">
        <h2>My Gallery</h2>
        <span class="toggle-arrow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </div>
      <div id="gallery-grid" class="gallery-grid"></div>
      <p id="gallery-empty" class="empty-text hidden">No moments captured yet</p>
    </section>

    <!-- Chat toggle button -->
    <button id="chat-toggle-btn" class="chat-fab" aria-label="Open Chat">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span id="chat-badge" class="chat-badge hidden">0</span>
    </button>

    <!-- Chat panel -->
    <div id="chat-panel" class="chat-panel hidden">
      <div class="chat-header">
        <h3>Live Chat</h3>
        <button id="chat-close-btn" class="icon-btn" aria-label="Close Chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-bar">
        <input type="text" id="chat-input" placeholder="Type a message…" maxlength="500">
        <button id="chat-send-btn" class="btn-send" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Media preview modal -->
  <div id="media-modal" class="modal hidden">
    <div class="media-modal-content">
      <button id="media-modal-close" class="modal-close-btn" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="media-modal-body"></div>
    </div>
  </div>

  <!-- Socket.IO served by the same origin/base path -->
  <script src="socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chat.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('js/sw.js').catch(function(){});
    }
  </script>
</body>
</html>
