<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DisposableCam">
  <link rel="apple-touch-icon" href="images/icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <title>Disposable Camera</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script>
    (function () {
      var p = window.location.pathname;
      var isAdmin = /\/admin(\/|$)/.test(p);
      var isLive  = /\/live(\/|$)/.test(p);
      var isRecap = /\/recap(\/|$)/.test(p);
      if (!isAdmin && !isLive && !isRecap && window.innerWidth >= 1024) {
        window.location.href = 'live';
      }
    })();
  </script>

  <!-- Micro toast overlay (session / notifications) -->
  <div id="micro-toast" class="micro-toast hidden"></div>

  <!-- Welcome landing (full-page event cover) -->
  <div id="registration-modal" class="welcome-screen">
    <div id="welcome-cover" class="welcome-cover"></div>
    <div class="welcome-overlay">
      <div class="welcome-content">
        <p class="welcome-eyebrow">Disposable Camera</p>
        <h1 id="welcome-event-name">The Moments</h1>
        <p id="welcome-event-subtitle" class="welcome-subtitle">Retreat Event</p>
        <div class="welcome-form">
          <input type="text" id="participant-input" placeholder="Enter participant number" autocomplete="off">
          <button id="register-btn" class="btn-primary">Join Event</button>
          <p id="register-error" class="error-text"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Main app — full-screen camera -->
  <div id="app" class="hidden">
    <section id="camera-section">
      <div id="viewfinder">
        <div id="zoom-layer">
          <video id="camera-preview" autoplay playsinline muted></video>
        </div>
        <canvas id="capture-canvas" class="hidden"></canvas>

        <!-- Top bar -->
        <div class="vf-top">
          <div class="profile-chip">
            <div id="gender-icon" class="gender-icon"></div>
            <div class="profile-text">
              <h1 id="user-name"></h1>
              <span id="user-number"></span>
            </div>
            <button id="logout-btn" class="profile-logout-btn" title="Logout" aria-label="Logout">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
          </div>
        </div>

        <!-- Flash — isolated top-right -->
        <button id="flash-btn" class="vf-flash-btn" title="Flash" aria-label="Flash" data-mode="off">
          <svg class="flash-icon flash-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <svg class="flash-icon flash-on hidden" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </button>

        <!-- REC indicator -->
        <div id="recording-indicator" class="hidden">
          <span class="rec-dot"></span> REC <span id="rec-timer">00:00</span>
        </div>

        <!-- Bottom controls -->
        <div class="vf-bottom">
          <button id="gallery-btn" class="gallery-thumb-btn" aria-label="Gallery">
            <span id="gallery-thumb" class="gallery-thumb-inner">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </span>
          </button>

          <div class="vf-shutter-row">
            <button id="zoom-indicator" class="zoom-pill" aria-label="Reset zoom">1×</button>
            <button id="capture-btn" class="capture-btn" aria-label="Capture">
              <div class="capture-inner"></div>
            </button>
            <button id="mode-toggle-btn" class="video-mode-btn" title="Photo/Video" aria-label="Switch Mode" aria-pressed="false">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            </button>
          </div>

          <button id="rotate-btn" class="vf-side-btn" aria-label="Flip Camera">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            <span>Flip</span>
          </button>
        </div>
      </div>

      <!-- Upload progress -->
      <div id="upload-progress" class="hidden">
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <p class="progress-text">Uploading…</p>
      </div>
    </section>

    <!-- Chat FAB -->
    <button id="chat-toggle-btn" class="chat-fab" aria-label="Open Chat">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span id="chat-badge" class="chat-badge hidden">0</span>
    </button>

    <!-- Chat panel -->
    <div id="chat-panel" class="chat-panel hidden">
      <div class="chat-header">
        <div class="chat-tabs">
          <button id="chat-tab-public" class="chat-tab active">Public</button>
          <button id="chat-tab-private" class="chat-tab">Private</button>
        </div>
        <button id="chat-close-btn" class="icon-btn" aria-label="Close Chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="private-recipient-bar" class="private-recipient-bar hidden">
        <select id="dm-select" class="dm-select-dropdown">
          <option value="">— Select recipient —</option>
        </select>
        <input type="search" id="dm-search" placeholder="Search & filter list below…" autocomplete="off">
        <div id="dm-participant-list" class="dm-participant-list"></div>
        <input type="hidden" id="private-recipient" value="">
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div id="chat-upload-error" class="chat-upload-error hidden"></div>
      <div class="chat-input-bar">
        <button id="chat-attach-btn" class="btn-attach" aria-label="Share from gallery">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </button>
        <input type="text" id="chat-input" placeholder="Type a message…" maxlength="500">
        <button id="chat-send-btn" class="btn-send" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Review screen (post-capture) -->
  <div id="review-screen" class="review-screen hidden">
    <div class="review-preview-wrap">
      <div id="review-media" class="review-media"></div>
      <div id="review-caption-bar" class="review-caption-bar bottom">
        <span id="review-caption-text"></span>
      </div>
    </div>
    <div class="review-controls">
      <input type="text" id="review-caption-input" placeholder="Add a caption…" maxlength="100">
      <div class="review-caption-pos">
        <span>Caption position:</span>
        <button id="caption-pos-top" class="pos-btn">Top</button>
        <button id="caption-pos-bottom" class="pos-btn active">Bottom</button>
      </div>
      <div class="review-actions">
        <button id="review-discard-btn" class="review-btn discard">Discard</button>
        <button id="review-upload-btn" class="review-btn upload">Upload</button>
      </div>
    </div>
  </div>

  <!-- Chat gallery picker -->
  <div id="chat-gallery-picker" class="chat-gallery-picker hidden">
    <div class="picker-header">
      <h3>Share from Gallery</h3>
      <button id="chat-picker-close" class="icon-btn" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="chat-picker-grid" class="chat-picker-grid"></div>
    <p id="chat-picker-empty" class="empty-text hidden">No moments in your gallery yet</p>
  </div>

  <!-- Gallery modal -->
  <div id="gallery-modal" class="gallery-modal hidden">
    <div class="gallery-modal-header">
      <h2>My Gallery</h2>
      <button id="gallery-modal-close" class="icon-btn" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="gallery-grid" class="gallery-grid"></div>
    <p id="gallery-empty" class="empty-text hidden">No moments captured yet</p>
  </div>

  <!-- Media preview modal -->
  <div id="media-modal" class="modal hidden">
    <div class="media-modal-content">
      <button id="media-modal-close" class="modal-close-btn" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="media-modal-body"></div>
    </div>
  </div>

  <script src="socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chat.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('js/sw.js').catch(function(){});
    }
  </script>
</body>
</html>
