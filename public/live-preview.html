<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Live Moments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/live-preview.css">
</head>
<body>
  <div id="waiting-screen">
    <div class="wait-ring"></div>
    <h1>Live Moments</h1>
    <p>Waiting for the first capture</p>
  </div>

  <div id="live-app" class="hidden">
    <header class="live-header">
      <h1>Live Moments</h1>
      <span id="upload-count">0 moments</span>
      <span id="live-clock"></span>
    </header>

    <div class="masonry-dashboard">
      <aside id="col-left" class="masonry-col"></aside>

      <main class="center-stage">
        <div id="spotlight" class="spotlight">
          <div id="spotlight-media" class="spotlight-media"></div>
          <div id="spotlight-caption" class="spotlight-caption hidden"></div>
          <div class="spotlight-meta">
            <span id="spotlight-name"></span>
            <span id="spotlight-number"></span>
          </div>
          <div class="spotlight-progress"><div id="spotlight-bar"></div></div>
        </div>
      </main>

      <aside id="col-right" class="masonry-col"></aside>
    </div>
  </div>

  <div id="micro-toast" class="micro-toast"></div>

  <script src="socket.io/socket.io.js"></script>
  <script src="js/live-preview.js"></script>
</body>
</html>
