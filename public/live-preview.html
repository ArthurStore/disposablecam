<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Live Moments — Projector View</title>
  <link rel="stylesheet" href="css/live-preview.css">
</head>
<body>
  <div id="waiting-screen">
    <div class="wait-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </div>
    <h1>Live Moments</h1>
    <p>Waiting for the first capture…</p>
  </div>

  <div id="live-app" class="hidden">
    <header class="live-header">
      <div class="live-brand">
        <h1>Live Moments</h1>
        <span id="upload-count" class="upload-count">0 photos</span>
      </div>
      <div id="live-clock" class="live-clock"></div>
    </header>

    <div class="live-layout">
      <!-- Featured spotlight -->
      <section class="spotlight-section">
        <div id="spotlight" class="spotlight">
          <div id="spotlight-media" class="spotlight-media"></div>
          <div id="spotlight-caption" class="spotlight-caption hidden"></div>
          <div class="spotlight-info">
            <div id="spotlight-avatar" class="spotlight-avatar"></div>
            <div class="spotlight-meta">
              <span id="spotlight-name" class="spotlight-name"></span>
              <span id="spotlight-number" class="spotlight-number"></span>
            </div>
          </div>
          <div class="spotlight-progress"><div id="spotlight-bar" class="spotlight-bar"></div></div>
        </div>
      </section>

      <!-- Instagram-style grid feed -->
      <section class="grid-section">
        <div class="grid-tabs">
          <span class="grid-tab active">All Photos</span>
        </div>
        <div id="story-grid" class="story-grid"></div>
      </section>
    </div>
  </div>

  <div id="micro-toast" class="micro-toast"></div>

  <script src="socket.io/socket.io.js"></script>
  <script src="js/live-preview.js"></script>
</body>
</html>
